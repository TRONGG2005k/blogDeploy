

# HTTPS server
server {
    listen 443 ssl;
    server_name blog-test-trong.duckdns.org;

    # Nếu bạn chưa có cert, bỏ dòng ssl_certificate/ssl_certificate_key và dùng Cloudflare Flexible SSL
    ssl_certificate /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/privkey.pem;

    # Giới hạn file upload/download max 500MB
    client_max_body_size 500M;

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nếu backend nhận file upload qua /api, giới hạn max 500MB
        client_max_body_size 500M;
    }
}
