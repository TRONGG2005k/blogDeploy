server {
    listen 80;
    server_name blog-test-trong.duckdns.org;

    # Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    client_max_body_size 500M;
}

server {
    listen 443 ssl;
    server_name blog-test-trong.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/blog-test-trong.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog-test-trong.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 500M;

    # Reverse proxy backend
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward mọi request khác sang frontend container
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
