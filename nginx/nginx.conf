# HTTP redirect -> HTTPS + Certbot challenge
server {
    listen 80;
    server_name blog-test-trong.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name blog-test-trong.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/blog-test-trong.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog-test-trong.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 500M;

    # FE
    location / {
        try_files $uri /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads
    location /api/uploads/ {
        proxy_pass http://backend:8080/api/uploads/;
    }

    # Cache static files
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
