# HTTP → HTTPS redirect
server {
    listen 80;
    server_name blog-test-trong.duckdns.org;

    # Tự động chuyển hướng HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name blog-test-trong.duckdns.org;

    # Chỉ đường dẫn tới chứng chỉ
    ssl_certificate     /etc/ssl/private/live/blog-test-trong.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/live/blog-test-trong.duckdns.org/privkey.pem;


    # Bảo mật SSL cơ bản
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ---------------------------------------------------
    # FRONTEND (React build)
    # ---------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # ---------------------------------------------------
    # BACKEND (Spring Boot REST API)
    # ---------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080/;  # Tên service trong docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------
    # UPLOADS (nếu backend lưu file tại /uploads)
    # ---------------------------------------------------
    location /api/uploads/ {
        proxy_pass http://backend:8080/api/uploads/;
    }

    # ---------------------------------------------------
    # Caching & tối ưu
    # ---------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
