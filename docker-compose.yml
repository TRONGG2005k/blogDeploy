version: "3.8"
services:
  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    environment:
      - DBMS_URL_DEV=${DB_URL}
      - DBMS_USERNAME_DEV=${DB_USERNAME}
      - DBMS_PASSWORD_DEV=${DB_PASSWORD}
      - SPRING_REDIS_HOST=${REDIS_HOST}
      - SPRING_REDIS_PORT=${REDIS_PORT}
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SIGNER_KEY_ACCESS_DEV=${JWT_SIGNER_ACCESS}
      - SIGNER_KEY_REFRESH_DEV=${JWT_SIGNER_REFRESH}
      - CLIENT_ID_DEV=${GOOGLE_CLIENT_ID}
      - CLIENT_SECRET_DEV=${GOOGLE_CLIENT_SECRET}
      - REDIRECT_URI_DEV=${GOOGLE_REDIRECT_URI}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_GOOGLE_REDIRECT_URI=${VITE_GOOGLE_REDIRECT_URI}
    ports:
      - "5173:80"

  mysql:
    image: mysql:innovation-oracle
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=blog
      - MYSQL_ROOT_HOST=%
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

volumes:
  mysqldata:
